# pnpm settings. In pnpm 10.x+ only auth/registry settings are read from
# .npmrc; everything else (including supply-chain hardening) lives here.

# Supply-chain hardening; see https://pnpm.io/settings
# Delay installs until a published version has had time to be vetted.
# Value is in minutes; 10080 = 7 days. This mirrors the consuming GAIA app on
# purpose: because this config can only ever pin dependencies that have already
# cleared the 7-day window, every release of @gaia-react/lint installs cleanly
# inside GAIA's own quarantine. GAIA exempts the @gaia-react/lint package itself
# from its release-age check, but NOT lint's transitive deps; enforcing the
# window here is what keeps those deps pre-aged so no downstream exclusion is
# needed.
minimumReleaseAge: 10080

# Fail the install if a package's trust level has decreased vs prior releases.
trustPolicy: no-downgrade

# Acknowledge known-good packages that trip no-downgrade. Each is an old,
# pre-provenance release that is the correct, required version for its dependent.
# A newer MAJOR line later added npm provenance, so pnpm reads the older
# unattested release as a trust downgrade. These are not supply-chain
# regressions. Scope each exception to the exact version; no-downgrade stays
# enforced for everything else. Keep this list in sync with the consuming GAIA
# app, which trips the same packages when it re-resolves this config's subtree.
#   - semver@6.3.1: final 6.x release; required by eslint-config-airbnb-extended
#     -> eslint-plugin-import (^6.3.1)
#   - eslint-import-resolver-typescript@3.10.1: final 3.x release; required by
#     eslint-plugin-canonical (^3.7.0)
trustPolicyExclude:
  - 'semver@6.3.1'
  - 'eslint-import-resolver-typescript@3.10.1'
